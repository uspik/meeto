server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html не кешируем никогда: иначе вебвью Telegram держит старую
    # разметку со ссылками на прежние бандлы и обновление не доезжает
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # у собранных файлов в имени хеш — их можно кешировать сколько угодно
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
}
