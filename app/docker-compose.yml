services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meeto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meeto}
      POSTGRES_DB: ${POSTGRES_DB:-meeto}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meeto}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: ./backend
    # общий тег для api, bot и worker: иначе пересборка одного сервиса
    # оставляла остальные на старом коде, и шаблоны уведомлений расходились
    image: meeto-backend:local
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  bot:
    build: ./backend
    image: meeto-backend:local
    env_file: .env
    depends_on: [api]
    command: python -m app.bot
    restart: unless-stopped

  worker:
    build: ./backend
    image: meeto-backend:local
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    command: python -m app.worker
    restart: unless-stopped

  miniapp:
    build:
      context: ./miniapp
      args:
        VITE_API_BASE: /api/v1
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx/meeto.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on: [api, miniapp]
    # раз в 6 часов перечитываем конфиг — подхватываем обновлённый сертификат
    command: sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped

volumes:
  pgdata:
